# TRIAD-Map — occupancy updater (Sec. 3.4 / Fig. 4).  Overrides MapConfig.
resolution: 0.05
p_free_threshold: 0.49       # PGC band boundary
p_transition_threshold: 0.55 # TBB band boundary
persistence_frames: 3        # N = 3
p_hit_transition: 0.85       # TBB hit-model probability
neighborhood_radius: 0.15    # R of the persistence probe
p_occupied_threshold: 0.55
p_free_l3_threshold: 0.20    # consumed by TRIAD-Link L3
